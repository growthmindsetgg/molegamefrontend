<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Base Mini App verification -->
  <meta name="base:app_id" content="6953ea62c63ad87c980819a9" />

  <!-- Open Graph -->
  <meta property="og:title" content="Mole Smash" />
  <meta property="og:description" content="30 seconds. Tap fast. Beat your score." />
  <meta property="og:image" content="https://molesmash-mini.vercel.app/assets/hero.png" />
  <meta property="og:url" content="https://molesmash-mini.vercel.app/" />

  <!-- Farcaster Mini App metadata -->
  <meta property="fc:miniapp" content="true" />
  <meta property="fc:miniapp:name" content="Mole Smash" />
  <meta property="fc:miniapp:icon" content="https://molesmash-mini.vercel.app/assets/icon.png" />

  <title>Mole Smash</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #87ceeb;
      font-family: system-ui, sans-serif;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      color: white;
      font-weight: 700;
      pointer-events: none;
      z-index: 10;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 14px;
      width: 280px;
      text-align: center;
    }

    .card button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      background: #111;
      color: white;
    }

    .rules {
      font-size: 14px;
      opacity: 0.8;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div id="hud">
  <div id="score">score: 0</div>
  <div id="time">time: 30</div>
</div>

<div id="menu" class="overlay">
  <div class="card">
    <h2>🐹 mole smash</h2>
    <button onclick="startGame()">play</button>
    <button onclick="showRules()">rules</button>
  </div>
</div>

<div id="rules" class="overlay" style="display:none">
  <div class="card">
    <h2>rules</h2>
    <div class="rules">
      hit the mole when it pops up<br>
      each hit = +1 score<br>
      you have 30 seconds
    </div>
    <button onclick="hideRules()">got it</button>
  </div>
</div>

<div id="end" class="overlay" style="display:none">
  <div class="card">
    <h2 id="finalScore">score: 0</h2>
    <button onclick="restartGame()">play again</button>
  </div>
</div>

<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
<script src="https://unpkg.com/@farcaster/miniapp-sdk/dist/index.umd.js"></script>

<script>
/* ---------- FARCASTER READY (SAFE + RELIABLE) ---------- */
(function waitForFarcasterSDK() {
  if (window.sdk && window.sdk.actions && typeof window.sdk.actions.ready === "function") {
    window.sdk.actions.ready();
  } else {
    setTimeout(waitForFarcasterSDK, 50);
  }
})();
</script>

<script>
/* ---------- SPRITES ---------- */
function tex(svg) {
  return new THREE.TextureLoader().load(
    "data:image/svg+xml;base64," + btoa(svg)
  );
}
