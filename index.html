<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Base Mini App -->
  <meta name="base:app_id" content="6953ea62c63ad87c980819a9" />

  <!-- Open Graph -->
  <meta property="og:title" content="Mole Smash" />
  <meta property="og:description" content="30 seconds. Tap fast. Beat your score." />
  <meta property="og:image" content="https://molesmash-mini.vercel.app/assets/hero.png" />
  <meta property="og:url" content="https://molesmash-mini.vercel.app/" />

  <!-- Farcaster Mini App -->
  <meta property="fc:miniapp" content="true" />
  <meta property="fc:miniapp:name" content="Mole Smash" />
  <meta property="fc:miniapp:icon" content="https://molesmash-mini.vercel.app/assets/icon.png" />

  <title>Mole Smash</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #87ceeb;
      font-family: system-ui, sans-serif;
    }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      color: white;
      font-weight: 700;
      pointer-events: none;
      z-index: 10;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 14px;
      width: 280px;
      text-align: center;
    }

    .card button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      background: #111;
      color: white;
    }
  </style>
</head>

<body>

<div id="hud">
  <div id="score">score: 0</div>
  <div id="time">time: 30</div>
</div>

<div id="menu" class="overlay">
  <div class="card">
    <h2>🐹 mole smash</h2>
    <button onclick="startGame()">play</button>
  </div>
</div>

<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>

<!-- ✅ THIS WAS MISSING -->
<script src="https://unpkg.com/@farcaster/miniapp-sdk/dist/index.umd.js"></script>

<script>
/* ---------- FARCASTER READY (REAL FIX) ---------- */
window.addEventListener("load", () => {
  if (window.sdk?.actions?.ready) {
    sdk.actions.ready();
    console.log("Farcaster SDK ready()");
  }
});

/* ---------- GAME ---------- */

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 6, 8);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5, 10, 5);
scene.add(light);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(12, 12),
  new THREE.MeshStandardMaterial({ color: 0x4caf50 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

let score = 0;
let time = 30;
let running = false;

function startGame() {
  document.getElementById("menu").style.display = "none";
  running = true;
}

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
