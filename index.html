<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Base Mini App verification -->
  <meta name="base:app_id" content="6953ea62c63ad87c980819a9" />

  <!-- Open Graph -->
  <meta property="og:title" content="Mole Smash" />
  <meta property="og:description" content="30 seconds. Tap fast. Beat your score." />
  <meta property="og:image" content="https://molegamebaseapp.vercel.app/assets/hero.png" />
  <meta property="og:url" content="https://molegamebaseapp.vercel.app/" />

  <!-- Farcaster Mini App metadata -->
  <meta property="fc:miniapp" content="true" />
  <meta property="fc:miniapp:name" content="Mole Smash" />
  <meta property="fc:miniapp:icon" content="https://molegamebaseapp.vercel.app/assets/icon.png" />

  <!-- Farcaster Frame (preview only, not gameplay) -->
  <meta property="fc:frame" content="vNext" />
  <meta property="fc:frame:image" content="https://molegamebaseapp.vercel.app/assets/hero.png" />
  <meta property="fc:frame:button:1" content="Play" />
  <meta property="fc:frame:button:1:action" content="link" />
  <meta property="fc:frame:button:1:target" content="https://molegamebaseapp.vercel.app/?fc=1" />

  <title>Mole Smash</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #87ceeb;
      font-family: system-ui, sans-serif;
    }

    body.farcaster {
      overflow: hidden;
    }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      color: white;
      font-weight: 700;
      pointer-events: none;
      z-index: 10;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 14px;
      width: 280px;
      text-align: center;
    }

    .card button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      background: #111;
      color: white;
    }

    .rules {
      font-size: 14px;
      opacity: 0.8;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div id="hud">
  <div id="score">score: 0</div>
  <div id="time">time: 30</div>
</div>

<div id="menu" class="overlay">
  <div class="card">
    <h2>🐹 mole smash</h2>
    <button onclick="startGame()">play</button>
    <button onclick="showRules()">rules</button>
  </div>
</div>

<div id="rules" class="overlay" style="display:none">
  <div class="card">
    <h2>rules</h2>
    <div class="rules">
      hit the mole when it pops up<br>
      each hit = +1 score<br>
      you have 30 seconds
    </div>
    <button onclick="hideRules()">got it</button>
  </div>
</div>

<div id="end" class="overlay" style="display:none">
  <div class="card">
    <h2 id="finalScore">score: 0</h2>
    <button onclick="restartGame()">play again</button>
  </div>
</div>

<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
<script>
/* ---------- RUNTIME DETECTION ---------- */

const params = new URLSearchParams(window.location.search);
const IS_FARCASTER = params.has("fc");
const IS_IFRAME = window.parent !== window;

if (IS_FARCASTER) {
  document.body.classList.add("farcaster");
}

if (IS_FARCASTER && IS_IFRAME) {
  window.parent.postMessage({ type: "miniapp:ready" }, "*");
}

/* ---------- SPRITES ---------- */

function tex(svg) {
  return new THREE.TextureLoader().load(
    "data:image/svg+xml;base64," + btoa(svg)
  );
}

const moleTex = tex(`
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128">
<ellipse cx="64" cy="80" rx="36" ry="40" fill="#8b5a2b"/>
<circle cx="52" cy="72" r="4"/>
<circle cx="76" cy="72" r="4"/>
<ellipse cx="64" cy="86" rx="6" ry="4"/>
</svg>`);

const hitTex = tex(`
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128">
<ellipse cx="64" cy="80" rx="36" ry="40" fill="#8b5a2b"/>
<line x1="50" y1="70" x2="58" y2="76" stroke="black" stroke-width="3"/>
<line x1="58" y1="70" x2="50" y2="76" stroke="black" stroke-width="3"/>
<line x1="70" y1="70" x2="78" y2="76" stroke="black" stroke-width="3"/>
<line x1="78" y1="70" x2="70" y2="76" stroke="black" stroke-width="3"/>
<circle cx="64" cy="92" r="6"/>
</svg>`);

const hammerTex = tex(`
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128">
<rect x="30" y="20" width="60" height="30" fill="#e53935"/>
<rect x="58" y="50" width="12" height="60" fill="#ffccbc"/>
</svg>`);

/* ---------- SCENE ---------- */

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,6,8);
camera.lookAt(0,0,0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,0.6));
const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(5,10,5);
scene.add(light);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(12,12),
  new THREE.MeshStandardMaterial({color:0x4caf50})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

/* ---------- MOLES ---------- */

const moles = [];
[-3,0,3].forEach(x=>{
  const hole = new THREE.Mesh(
    new THREE.CylinderGeometry(1,1,0.2,32),
    new THREE.MeshStandardMaterial({color:0x000000})
  );
  hole.position.set(x,0.1,0);
  scene.add(hole);

  const m = new THREE.Sprite(new THREE.SpriteMaterial({map:moleTex}));
  m.scale.set(1.8,1.8,1);
  m.position.set(x,-0.6,0);
  m.userData = { hidden:-0.6, shown:0.5, vy:0 };
  scene.add(m);
  moles.push(m);
});

/* ---------- HAMMER ---------- */

const hammer = new THREE.Sprite(new THREE.SpriteMaterial({map:hammerTex}));
hammer.scale.set(1.4,1.4,1);
hammer.visible = false;
scene.add(hammer);

/* ---------- GAME STATE ---------- */

let active=null, score=0, time=30, running=false;
let moleLoop, timeLoop;

const scoreEl = document.getElementById("score");
const timeEl = document.getElementById("time");

/* ---------- GAME FLOW ---------- */

function startGame(){
  document.getElementById("menu").style.display="none";
  score=0; time=30; running=true;
  scoreEl.textContent="score: 0";
  timeEl.textContent="time: 30";

  moleLoop=setInterval(showMole,1000);
  timeLoop=setInterval(()=>{
    time--;
    timeEl.textContent="time: "+time;
    if(time<=0) endGame();
  },1000);
}

function endGame(){
  running=false;
  clearInterval(moleLoop);
  clearInterval(timeLoop);
  hideMoles();
  document.getElementById("finalScore").textContent="score: "+score;
  document.getElementById("end").style.display="flex";
}

function restartGame(){
  document.getElementById("end").style.display="none";
  startGame();
}

function showRules(){
  document.getElementById("rules").style.display="flex";
}
function hideRules(){
  document.getElementById("rules").style.display="none";
}

/* ---------- MOLE MOTION ---------- */

function hideMoles(){
  moles.forEach(m=>{
    m.userData.vy=-0.02;
    m.material.map=moleTex;
    m.scale.set(1.8,1.8,1);
  });
  active=null;
}
function showMole(){
  if(!running) return;
  hideMoles();
  active=moles[Math.floor(Math.random()*3)];
  active.userData.vy=0.04;
}
function updateMoles(){
  moles.forEach(m=>{
    if(m.userData.vy!==0){
      m.position.y+=m.userData.vy;
      if(m.position.y>=m.userData.shown||m.position.y<=m.userData.hidden){
        m.position.y=Math.max(Math.min(m.position.y,m.userData.shown),m.userData.hidden);
        m.userData.vy=0;
      }
    }
  });
}

/* ---------- HIT TEST ---------- */

function screenToWorld(x, y) {
  const v = new THREE.Vector3(
    (x / innerWidth) * 2 - 1,
    -(y / innerHeight) * 2 + 1,
    0.5
  );
  v.unproject(camera);
  const dir = v.sub(camera.position).normalize();
  const dist = -camera.position.y / dir.y;
  return camera.position.clone().add(dir.multiplyScalar(dist));
}

function isHitMole(p, m) {
  if(!m || m.position.y < 0.45) return false;
  const dx=p.x-m.position.x, dz=p.z-m.position.z;
  return dx*dx+dz*dz <= 1.05*1.05;
}

/* ---------- INPUT ---------- */

window.addEventListener("pointerdown",(e)=>{
  if(!running) return;

  const p = screenToWorld(e.clientX, e.clientY);

  hammer.position.set(p.x,1.2,p.z);
  hammer.rotation.z=-Math.PI/3;
  hammer.visible=true;

  setTimeout(()=>hammer.rotation.z=0,40);
  setTimeout(()=>hammer.visible=false,120);

  if(active && isHitMole(p,active)){
    score++;
    scoreEl.textContent="score: "+score;
    active.material.map=hitTex;
    active.scale.set(1.6,1.4,1);
    setTimeout(hideMoles,180);
  }
});

/* ---------- LOOP ---------- */

function animate(){
  requestAnimationFrame(animate);
  updateMoles();
  renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
